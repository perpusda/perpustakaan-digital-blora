<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Perpustakaan Digital Kabupaten Blora</title>
    <link rel="icon" type="image/gif" href="https://upload.wikimedia.org/wikipedia/commons/4/43/Lambang_Kabupaten_Blora.gif">

    <!-- Bootstrap 5 CSS & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
        }

        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: #eff6ff;
            color: var(--primary);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 16px;
        }

        .form-control-clean {
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-control-clean:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .btn-modern-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-modern-primary:hover {
            background-color: var(--primary-hover);
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
    </style>
</head>

<body>

    <div class="login-card">
        <!-- BRANDING -->
        <div class="text-center mb-4">
            <div class="mb-3">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/43/Lambang_Kabupaten_Blora.gif" 
                     alt="Lambang Kabupaten Blora" 
                     style="width: 58px; height: 68px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));">
            </div>
            <h4 class="fw-bold mb-1" style="letter-spacing: -0.02em;">Perpustakaan Digital</h4>
            <p class="text-muted small mb-0">Kabupaten Blora • Katalog Terpusat</p>
        </div>

        <div id="message"></div>

        <!-- FORM LOGIN -->
        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Email Terdaftar</label>
            <input type="email" id="email" class="form-control form-control-clean" placeholder="nama@email.com" autofocus>
        </div>

        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label small fw-semibold text-secondary mb-0">Password</label>
            </div>
            <input type="password" id="password" class="form-control form-control-clean" placeholder="Masukkan password akun">
        </div>

        <button type="button" id="loginBtn" class="btn btn-modern-primary w-100 mb-4">
            Masuk ke Aplikasi
        </button>

        <div class="text-center pt-3 border-top small">
            <span class="text-muted">Ingin mendaftarkan perpustakaan sekolah / desa Anda?</span>
            <div class="mt-2">
                <a href="daftar-perpustakaan.html" class="text-primary text-decoration-none fw-semibold">
                    <i class="bi bi-building-add me-1"></i> Daftar Perpustakaan Mitra Baru
                </a>
            </div>
            <div class="mt-3">
                <a href="index.html" class="text-muted text-decoration-none small"><i class="bi bi-arrow-left me-1"></i> Kembali ke Katalog Publik</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        import { SUPABASE_URL, SUPABASE_ANON_KEY } from './js/config.js';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const message = document.getElementById('message');

        loginBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                message.innerHTML = `
                    <div class="alert alert-warning py-2 small rounded-3 mb-3">
                        <i class="bi bi-exclamation-circle me-1"></i> Email dan password wajib diisi.
                    </div>
                `;
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Memproses...';
            message.innerHTML = '';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;
                const user = data.user;

                // Ambil profil user
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('id, full_name, email, role, status')
                    .eq('id', user.id)
                    .single();

                if (profileError) throw profileError;

                if (profile.status !== 'ACTIVE') {
                    await supabase.auth.signOut();
                    throw new Error('Akun Anda sedang dinonaktifkan atau belum aktif.');
                }

                let activeRole = profile.role;

                // Verifikasi apakah user terdaftar sebagai admin di library_admins atau pemilik di libraries
                const { data: adminRel } = await supabase
                    .from('library_admins')
                    .select('id, library_id')
                    .eq('user_id', user.id)
                    .maybeSingle();

                const { data: libOwner } = await supabase
                    .from('libraries')
                    .select('id')
                    .eq('email', user.email)
                    .maybeSingle();

                if (adminRel || libOwner) {
                    activeRole = 'LIBRARY_ADMIN';
                }

                localStorage.setItem('userRole', activeRole);
                localStorage.setItem('userName', profile.full_name || '');

                // Redirect sesuai Role
                if (activeRole === 'SUPER_ADMIN') {
                    window.location.href = 'dashboard-admin.html';
                } else if (activeRole === 'LIBRARY_ADMIN') {
                    window.location.href = 'dashboard-perpustakaan.html';
                } else {
                    window.location.href = 'dashboard-anggota.html';
                }

            } catch (error) {
                console.error(error);
                message.innerHTML = `
                    <div class="alert alert-danger py-2 small rounded-3 mb-3">
                        <i class="bi bi-x-circle me-1"></i> ${error.message}
                    </div>
                `;
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Masuk ke Aplikasi';
            }
        });

        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });
    </script>
</body>

</html>
